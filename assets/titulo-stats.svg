    <linearGradient id="st-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="1"/></linearGradient>
    <linearGradient id="st-r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2bd6" stop-opacity="1"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="20" y="26" width="215" height="3" rx="1.5" fill="url(#st-l)" filter="url(#glow-stats-title)"/>
