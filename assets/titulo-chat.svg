<svg xmlns="http://www.w3.org/2000/svg" width="840" height="54" viewBox="0 0 840 54" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow-chat" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="chat-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="1"/></linearGradient>
    <linearGradient id="chat-r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2bd6" stop-opacity="1"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="20" y="26" width="245" height="3" rx="1.5" fill="url(#chat-l)" filter="url(#glow-chat)"/>
  <text x="420" y="34" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">💌 Vamos <tspan fill="#ff2bd6">conversar?</tspan></text>
  <rect x="575" y="26" width="245" height="3" rx="1.5" fill="url(#chat-r)" filter="url(#glow-chat)"/>
</svg>
