<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0b30"/>
      <stop offset="1" stop-color="#0d0b1e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="544" height="384" rx="22" fill="url(#bg)" stroke="#ff2bd6" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="16" y="16" width="528" height="368" rx="16" fill="none" stroke="#ff2bd6" stroke-opacity="0.3"/>
  <rect x="40" y="34" width="56" height="40" rx="6" fill="#1b1040" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="68" y="61" font-size="18" font-weight="700" fill="#ff2bd6" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">&lt;/&gt;</text>
  <path d="M32 80 H104 L98 74 H38 Z" fill="#a78bfa"/>
  <text x="120" y="68" font-size="36" font-weight="800" fill="#ffffff">Sobre <tspan fill="#ff2bd6">Mim</tspan></text>
  <rect x="120" y="82" width="110" height="3" rx="1.5" fill="#ff2bd6" filter="url(#glow)"/>
  <rect x="34" y="132" width="3" height="108" rx="1.5" fill="#ff2bd6" filter="url(#glow)"/>
  <rect x="34" y="250" width="3" height="64" rx="1.5" fill="#ff2bd6" filter="url(#glow)"/>
  <rect x="34" y="326" width="3" height="44" rx="1.5" fill="#ff2bd6" filter="url(#glow)"/>
  <g font-size="14.5" fill="#f1ecff">
    <text x="50" y="150">Sou uma Desenvolvedora Front-End focada em construir</text>
    <text x="50" y="171">interfaces modernas, funcionais e altamente responsivas.</text>
    <text x="50" y="192">Com formação técnica em Web Development, minha atuação</text>
    <text x="50" y="213">é voltada para a criação de experiências digitais que unem</text>
    <text x="50" y="234">performance técnica e um design intuitivo.</text>
    <text x="50" y="268">Tenho forte base em tecnologias como React, JavaScript (ES6+),</text>
    <text x="50" y="289">HTML5 e CSS3, o que me permite transformar protótipos em</text>
    <text x="50" y="310">aplicações reais, seguras e preparadas para o mercado.</text>
    <text x="50" y="344">Mais do que codificar, eu projeto interfaces estratégicas que</text>
    <text x="50" y="365">entregam valor real ao usuário e resultados sólidos para o negócio.</text>
  </g>
</svg>
