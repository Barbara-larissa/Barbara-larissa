<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" font-family="&#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow-title" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="neon-pill" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="grad-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0" />
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="grad-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="1" />
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pill-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0d36" />
      <stop offset="1" stop-color="#0d091c" />
    </linearGradient>
  </defs>

  <!-- TÍTULO TECNOLOGIAS -->
  <rect x="30" y="28" width="285" height="3" rx="1.5" fill="url(#grad-l)" filter="url(#glow-title)" />
  <g transform="translate(334, 16)" fill="none" stroke="#ff2bd6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-title)">
    <polygon points="12 2 2 7 12 12 22 7 12 2" />
    <polyline points="2 12 12 17 22 12" />
    <polyline points="2 17 12 22 22 17" />
  </g>
  <text x="368" y="36" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="0.5">Tecnologias</text>
  <rect x="535" y="28" width="315" height="3" rx="1.5" fill="url(#grad-r)" filter="url(#glow-title)" />

  <!-- LINHA 1 DE PÍLULAS -->
  <!-- HTML5 -->
  <g transform="translate(10, 68)">
    <rect width="112" height="44" rx="22" fill="url(#pill-bg)" stroke="#f97316" stroke-width="2" filter="url(#neon-pill)" />
    <rect x="14" y="11" width="22" height="22" rx="5" fill="#e34f26" />
    <text x="25" y="26" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
    <text x="72" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">HTML5</text>
  </g>

  <!-- CSS3 -->
  <g transform="translate(132, 68)">
    <rect width="104" height="44" rx="22" fill="url(#pill-bg)" stroke="#38bdf8" stroke-width="2" filter="url(#neon-pill)" />
    <rect x="14" y="11" width="22" height="22" rx="5" fill="#1572b6" />
    <text x="25" y="26" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    <text x="68" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">CSS3</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(246, 68)">
    <rect width="134" height="44" rx="22" fill="url(#pill-bg)" stroke="#facc15" stroke-width="2" filter="url(#neon-pill)" />
    <rect x="14" y="11" width="22" height="22" rx="5" fill="#f7df1e" />
    <text x="25" y="26" font-size="10.5" font-weight="900" fill="#000000" text-anchor="middle">JS</text>
    <text x="84" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">JavaScript</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(390, 68)">
    <rect width="134" height="44" rx="22" fill="url(#pill-bg)" stroke="#3b82f6" stroke-width="2" filter="url(#neon-pill)" />
    <rect x="14" y="11" width="22" height="22" rx="5" fill="#3178c6" />
    <text x="25" y="26" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">TS</text>
    <text x="84" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">TypeScript</text>
  </g>

  <!-- React -->
  <g transform="translate(534, 68)">
    <rect width="110" height="44" rx="22" fill="url(#pill-bg)" stroke="#22d3ee" stroke-width="2" filter="url(#neon-pill)" />
    <circle cx="25" cy="22" r="2.5" fill="#61dafb" />
    <ellipse cx="25" cy="22" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.4" />
    <ellipse cx="25" cy="22" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.4" transform="rotate(60 25 22)" />
    <ellipse cx="25" cy="22" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.4" transform="rotate(120 25 22)" />
    <text x="71" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">React</text>
  </g>

  <!-- Tailwind CSS -->
  <g transform="translate(654, 68)">
    <rect width="146" height="44" rx="22" fill="url(#pill-bg)" stroke="#06b6d4" stroke-width="2" filter="url(#neon-pill)" />
    <path d="M16 20 Q20 14 25 18 T34 16 M14 26 Q18 20 23 24 T32 22" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
    <text x="90" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Tailwind CSS</text>
  </g>

  <!-- Git -->
  <g transform="translate(810, 68)">
    <rect width="60" height="44" rx="22" fill="url(#pill-bg)" stroke="#f05032" stroke-width="2" filter="url(#neon-pill)" />
    <rect x="19" y="13" width="18" height="18" rx="3" fill="#f05032" transform="rotate(45 28 22)" />
    <circle cx="28" cy="18" r="2" fill="#ffffff" />
    <circle cx="28" cy="26" r="2" fill="#ffffff" />
    <line x1="28" y1="18" x2="28" y2="26" stroke="#ffffff" stroke-width="1.8" />
  </g>

  <!-- LINHA 2 DE PÍLULAS -->
  <!-- Node.js -->
  <g transform="translate(18, 128)">
    <rect width="120" height="44" rx="22" fill="url(#pill-bg)" stroke="#4ade80" stroke-width="2" filter="url(#neon-pill)" />
    <polygon points="25,11 35,16.5 35,27.5 25,33 15,27.5 15,16.5" fill="#339933" />
    <text x="25" y="25.5" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">JS</text>
    <text x="76" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Node.js</text>
  </g>

  <!-- Express -->
  <g transform="translate(148, 128)">
    <rect width="122" height="44" rx="22" fill="url(#pill-bg)" stroke="#c084fc" stroke-width="2" filter="url(#neon-pill)" />
    <circle cx="25" cy="22" r="11" fill="#3f3f46" />
    <text x="25" y="26" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">ex</text>
    <text x="77" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Express</text>
  </g>

  <!-- PHP -->
  <g transform="translate(280, 128)">
    <rect width="104" height="44" rx="22" fill="url(#pill-bg)" stroke="#818cf8" stroke-width="2" filter="url(#neon-pill)" />
    <ellipse cx="26" cy="22" rx="13" ry="8" fill="#777bb4" />
    <text x="26" y="25.5" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">php</text>
    <text x="69" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">PHP</text>
  </g>

  <!-- MySQL -->
  <g transform="translate(394, 128)">
    <rect width="120" height="44" rx="22" fill="url(#pill-bg)" stroke="#38bdf8" stroke-width="2" filter="url(#neon-pill)" />
    <ellipse cx="25" cy="17" rx="9" ry="3.5" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M16 17 v10 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5 v-10" fill="none" stroke="#f59e0b" stroke-width="1.8" />
    <text x="75" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">MySQL</text>
  </g>

  <!-- Firebase -->
  <g transform="translate(524, 128)">
    <rect width="126" height="44" rx="22" fill="url(#pill-bg)" stroke="#fbbf24" stroke-width="2" filter="url(#neon-pill)" />
    <polygon points="25,11 33,27 25,33 17,27" fill="#ffca28" />
    <polygon points="25,11 25,33 17,27" fill="#ffa000" />
    <text x="78" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Firebase</text>
  </g>

  <!-- Supabase -->
  <g transform="translate(660, 128)">
    <rect width="132" height="44" rx="22" fill="url(#pill-bg)" stroke="#34d399" stroke-width="2" filter="url(#neon-pill)" />
    <polygon points="26,11 17,24 25,24 23,33 33,20 25,20" fill="#3ecf8e" />
    <text x="81" y="27" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Supabase</text>
  </g>

  <!-- GitHub -->
  <g transform="translate(802, 128)">
    <rect width="68" height="44" rx="22" fill="url(#pill-bg)" stroke="#ff2bd6" stroke-width="2" filter="url(#neon-pill)" />
    <path transform="translate(25, 13)" fill="#ffffff" d="M9 1a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.22.48-2.69-1.07-2.69-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.82 1.23.82.71 1.22 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 9 1z" />
  </g>
</svg>